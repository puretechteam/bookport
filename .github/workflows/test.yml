name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.16,<0.17"
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # add ubuntu-latest once the suite has been run on Linux
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # tests that need calibre, epubcheck or PyMuPDF (independent readers to check output against) skip without them
      - run: python -m pytest -q
