[package]
name = "bookport-native"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pure Tech"]
description = "Compiled DjVu decoders for bookport (optional: bookport works without them)"
publish = false

[lib]
name = "bookport_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
