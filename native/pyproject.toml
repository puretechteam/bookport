[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "bookport-native"
version = "0.4.0"
description = "Compiled DjVu decoders for bookport: the same results, much faster. Optional: bookport works without them."
license = "MIT"
authors = [{ name = "Pure Tech" }]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/puretechteam/bookport"

[tool.maturin]
module-name = "bookport_native"
features = ["extension-module"]
